name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check script syntax and skill metadata
        shell: bash
        run: |
          bash -n skills/dagger-exe/scripts/*.sh
          grep -Eq '^name: dagger-exe$' skills/dagger-exe/SKILL.md
          grep -Eq '^  version: "[0-9]+\.[0-9]+\.[0-9]+"$' skills/dagger-exe/SKILL.md
