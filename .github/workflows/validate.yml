name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check script syntax and skill metadata
        shell: bash
        run: |
          bash -n skills/dagger-exe/scripts/*.sh
          grep -Eq '^name: dagger-exe$' skills/dagger-exe/SKILL.md
          grep -Eq '^  version: "[0-9]+\.[0-9]+\.[0-9]+"$' skills/dagger-exe/SKILL.md
          grep -Eq '^name: pass$' skills/pass/SKILL.md
          grep -Eq '^  version: "[0-9]+\.[0-9]+\.[0-9]+"$' skills/pass/SKILL.md
          grep -Eq '^name: exe-dev$' skills/exe-dev/SKILL.md
          grep -Eq '^  version: "[0-9]+\.[0-9]+\.[0-9]+"$' skills/exe-dev/SKILL.md
          grep -Eq '^[0-9a-f]{40}$' skills/exe-dev/references/upstream-skill.sha
      - name: Test pass helpers without real credentials
        run: |
          python3 -m json.tool harnesses/opencode/opencode.jsonc > /dev/null
          python3 -m unittest discover -s tests -v
