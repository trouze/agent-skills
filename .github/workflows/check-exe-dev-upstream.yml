name: Check upstream exe.dev skill

on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'trouze/agent-skills'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare upstream skill revision (no content copied)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          recorded=$(cat skills/exe-dev/references/upstream-skill.sha)
          latest=$(gh api 'repos/boldsoftware/exe.dev/commits?path=skill%2FSKILL.md&per_page=1' --jq '.[0].sha')
          [[ "$recorded" =~ ^[0-9a-f]{40}$ && "$latest" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$latest" != "$recorded" ]]; then
            echo "::warning::Upstream exe.dev skill changed; review $recorded...$latest"
            echo "Review https://github.com/boldsoftware/exe.dev/compare/$recorded...$latest and update the skill + recorded SHA in a PR." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Upstream exe.dev skill unchanged at $recorded." >> "$GITHUB_STEP_SUMMARY"
